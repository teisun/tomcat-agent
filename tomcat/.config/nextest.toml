[test-groups]
serial = { max-threads = 1 }
real-llm = { max-threads = 2 }

# The inventory and exact cases below are checked against scripts/test-groups.sh.
[profile.default]
test-threads = 4
default-filter = '''not (binary(current_tail_guard_real_llm_tests) or binary(openai_responses_integration_tests) or binary(plan_real_llm_inprocess_tests) or binary(plan_real_llm_cli_e2e) or binary(reasoning_continuity_real_llm_tests) or (binary(cli_tests) and test(/_real_llm_cli$/)) or (binary(cli_tests) and test(/^(test_chat_with_valid_config_and_api_key_starts_and_produces_output|test_user_asks_pi_a_question|test_user_asks_pi_technical_question|test_user_asks_pi_to_run_bash_command|test_user_sees_read_failure_reason_in_tool_line|test_user_asks_pi_to_write_hello_world_bash|test_user_chats_with_llm_gets_streaming_response|test_user_receives_nonempty_llm_response|test_user_chat_resumes_last_session|test_user_chat_non_interactive_with_prompt_flag)$/)) or (binary(llm_tests) and test(/^test_llm_provider_chat/)) or binary(current_tail_guard_real_llm_e2e) or binary(resume_hydration_perf) or binary(verify_skill_browser_scripts) or binary(model_presets_live_smoke_tests) or binary(prompt_cache_real_llm_tests) or binary(ui_acceptance_real_llm_e2e) or binary(openai_files_integration_tests) or binary(plan_evidence_real_llm_acceptance) or (binary(web_search_tool_tests) and test(/^(live_tavily_search_smoke|real_tavily_plugin_web_search|real_brave_plugin_web_search|real_serper_plugin_web_search|real_mimo_web_search)$/)) or (binary(web_fetch_tool_tests) and test(=live_example_fetch_smoke)) or (binary(skill_tool_tests) and test(=live_skill_load_roundtrip_with_real_llm)))'''

[profile.real-llm]
inherits = "default"
default-filter = '''(binary(current_tail_guard_real_llm_tests) or binary(openai_responses_integration_tests) or binary(plan_real_llm_inprocess_tests) or binary(plan_real_llm_cli_e2e) or binary(reasoning_continuity_real_llm_tests) or (binary(cli_tests) and test(/_real_llm_cli$/)) or (binary(cli_tests) and test(/^(test_chat_with_valid_config_and_api_key_starts_and_produces_output|test_user_asks_pi_a_question|test_user_asks_pi_technical_question|test_user_asks_pi_to_run_bash_command|test_user_sees_read_failure_reason_in_tool_line|test_user_asks_pi_to_write_hello_world_bash|test_user_chats_with_llm_gets_streaming_response|test_user_receives_nonempty_llm_response|test_user_chat_resumes_last_session|test_user_chat_non_interactive_with_prompt_flag)$/)) or (binary(llm_tests) and test(/^test_llm_provider_chat/)))'''

[[profile.real-llm.overrides]]
filter = 'all()'
test-group = 'real-llm'
