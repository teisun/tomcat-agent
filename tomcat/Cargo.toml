[package]
name = "tomcat"
version = "0.1.80"
edition = "2021"
license = "MIT"

[[bin]]
name = "tomcat"
path = "src/main.rs"

[[bin]]
name = "test_streamable_http_server"
path = "tests/support/test_streamable_http_server.rs"
test = false
required-features = ["test-streamable-http-server"]

[[test]]
name = "connector_http_tests"
path = "tests/connector_http_tests.rs"
required-features = ["test-streamable-http-server"]

[features]
# The fake Streamable HTTP/OAuth server is executable test infrastructure, not
# production connector code. Keep its HTTP server stack out of normal builds.
test-streamable-http-server = [
    "dep:axum",
    "rmcp/server",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1.14"
schemars = { version = "0.8", features = ["chrono"] }
# 主配置只支持 TOML；不要编译 config 未使用的 JSON/YAML/INI/RON/JSON5
# 加载器及其传递依赖。
config = { version = "0.14", default-features = false, features = ["toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
# Windows 的 canonicalize 返回 `\\?\C:\...`；dunce 只在安全时去掉该前缀，Unix 上等价于 std。
dunce = "1"
sys-locale = "0.3.2"
async-trait = "0.1"
# ACP v1 framing and typed handlers; no subprocess/stdio or draft-v2 SDK stack.
agent-client-protocol = "=3.4.0"
axum = { version = "0.8", optional = true }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "compat", "io"] }
tracing-appender = "0.2"
# 直连 HTTP 调用与 rmcp 的远程 MCP/OAuth transport 统一 reqwest 版本；
# 显式保留现有调用的 JSON、流式、表单、查询参数和 multipart 能力。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "form", "query", "multipart"] }
futures-util = "0.3"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string"] }
dialoguer = "0.11"
toml = "0.8"
tempfile = "3.10"
parking_lot = "0.12"
dashmap = "6"
rustyline = "18.0.0"
# 终端语法高亮无需 Oniguruma 的 C 构建依赖，改用纯 Rust 正则后端。
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ctrlc = { version = "3", features = ["termination"] }
swc_common = "18.0.1"
swc_ecma_ast = "20.0.1"
swc_ecma_codegen = "23.0.0"
swc_ecma_parser = "34.0.0"
swc_ecma_transforms_base = "37.0.0"
swc_ecma_transforms_typescript = "41.0.0"
sha2 = "0.10"
fs2 = "0.4"
serde_yaml = "0.9"
dotenvy = "0.15"
regex = "1"
globset = "0.4"
shell-words = "1"
ignore = "0.4"
base64 = "0.22"
memchr = "2"
xxhash-rust = { version = "0.8.15", features = ["xxh32"] }
moka = { version = "0.12.15", default-features = false, features = ["sync"] }
html2md = "0.2.15"
rquickjs = { version = "0.12.0", features = ["futures"] }
getrandom = "0.4.2"
uuid = { version = "1.23.3", features = ["v4"] }
aes-gcm = "0.10.3"
ed25519-dalek = "2.2.0"
# Do not use rmcp's `reqwest` feature: it enables reqwest/rustls and feature unification would
# silently reintroduce a second TLS backend. Keep this aligned with the direct reqwest feature.
rmcp = { version = "=3.4.0", default-features = false, features = ["auth", "client", "reqwest-native-tls", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# rmcp 的子进程封装（同版本的传递依赖）：infra/platform 用它让 MCP stdio 服务的整棵进程树随传输一起结束。
process-wrap = { version = "10", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }

# Unix-only 系统调用（进程组信号、文件身份与权限位），只在 infra/platform 内使用。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only：可取消的控制台/管道读取、VT 输出、包安装安全快照、写用户 PATH。
# 两者都已作为传递依赖在 Cargo.lock 中；平台差异统一收口在 infra/platform。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[profile.fast]
# 本地迭代：保留 release 的优化和符号裁剪，但禁用串行全程序 LTO；
# 不影响正式 release 产物。
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2"
predicates = "3"
dotenvy = "0.15"
# 启用 tokio test-util 仅在测试构建中生效；T2-P0-002 Phase D 用 `tokio::time::pause`
# / `start_paused = true` 让重试退避走虚拟时钟（详见 src/core/compaction/tests/preheat_and_truncation.rs）。
# `features` 是 additive：生产构建仍只用 [dependencies] 里的 `full` 集合，不引入测试工具。
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3.4.0"
wiremock = "0.6.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
# Schema fixture tests compile in-memory schemas only; HTTP resolution would
# activate reqwest's rustls feature in the test graph.
jsonschema = { version = "0.46.5", default-features = false }

# The Windows ask-question Ctrl+C path only exists in a real console; ConPTY gives
# tests an isolated one instead of the developer's own terminal.
[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"

