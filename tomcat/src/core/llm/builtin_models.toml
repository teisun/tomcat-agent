# Verified 2026-08-07. `context_window` is the default selection and
# `context_window_options` declares selectable windows. A user's choice belongs
# in model-thinking.json, never in this capability catalog. We expose a 400K
# compact tier plus the true 1M maximum whenever both exist; the default is the
# largest window that does not trigger a provider long-context price multiplier.

[[models]]
# Source (checked 2026-08-07): https://developers.openai.com/api/docs/models/gpt-5.2
id = "gpt-5.2"
model_name = "gpt-5.2"
api = "openai-responses"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
thinking_format = "openai"
supported_reasoning_levels = ["low", "medium", "high", "xhigh"]
context_window = 400000
max_output_tokens = 128000
description = "OpenAI GPT-5.2：400K context、128K maximum output 的通用推理模型。"
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

[[models]]
# Source (checked 2026-08-07): https://developers.openai.com/api/docs/pricing
# GPT-5.4+ charges long-context rates above 272K input, so 400K stays default.
id = "gpt-5.4"
model_name = "gpt-5.4"
api = "openai-responses"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
thinking_format = "openai"
supported_reasoning_levels = ["low", "medium", "high", "xhigh"]
context_window = 400000
context_window_options = [400000, 1000000]
max_output_tokens = 128000
description = "OpenAI GPT-5.4：可选 400K 或 1M context；1M 属于长上下文计费，默认 400K。"
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

