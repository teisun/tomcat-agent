[[models]]
# Source (checked 2026-10-14): https://api-docs.deepseek.com/quick_start/pricing
# Official DeepSeek V4 uses 1M context at one per-token price. The low/high/max
# effort tiers apply to every DeepSeek model; V4-Pro does not support vision.
id = "deepseek-v4-pro"
model_name = "deepseek-v4-pro"
api = "openai"
provider = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
thinking_format = "deepseek"
supported_reasoning_levels = ["low", "high", "max"]
context_window = 1000000
context_window_options = [400000, 1000000]
max_output_tokens = 384000
capabilities = { vision = false, files = false, tools = true, reasoning = true, web_search = false }

[[models]]
# Sources (checked 2026-10-14): https://api-docs.deepseek.com/quick_start/pricing
# https://api-docs.deepseek.com/guides/vision/ — the legacy name is served by
# V4.1-Flash and accepts images. The Files API only takes images, so files stays off.
