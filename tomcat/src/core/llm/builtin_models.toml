description = "OpenAI GPT-5.6：可选 400K 或 1M context；官方最大值约 1.05M，本目录统一为 1M；默认 400K 以避开长上下文计费。"
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

