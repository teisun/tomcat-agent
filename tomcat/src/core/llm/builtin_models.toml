# Verified 2026-10-14. `context_window` is the default selection and
# `context_window_options` declares selectable windows. A user's choice belongs
# in model-thinking.json, never in this capability catalog. We expose a 400K
# compact tier plus the true 1M maximum whenever both exist; the default is the
# largest window that does not trigger a provider long-context price multiplier.
# IDs added from 2026-10 use `provider/model`; `model_name` stays the upstream name.

[[models]]
# Sources (checked 2026-10-01): https://developers.openai.com/api/docs/models/gpt-5.6-sol
# https://developers.openai.com/api/docs/guides/fast-mode — Fast maps to priority.
id = "gpt-5.6"
model_name = "gpt-5.6"
api = "openai-responses"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
thinking_format = "openai"
supported_reasoning_levels = ["low", "medium", "high", "xhigh", "max"]
supported_speeds = ["fast"]
context_window = 400000
context_window_options = [400000, 1000000]
max_output_tokens = 128000
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

[[models]]
# Source (checked 2026-10-14): https://developers.openai.com/api/docs/models/gpt-6-astra
# 1.05M total context, 128K output; agent tool calls require Responses and the
# model rejects none/minimal effort. 400K stays the default to avoid long-context rates.
id = "openai/gpt-6-astra"
model_name = "gpt-6-astra"
api = "openai-responses"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
thinking_format = "openai"
supported_reasoning_levels = ["low", "medium", "high", "xhigh", "max"]
supported_speeds = ["fast"]
context_window = 400000
context_window_options = [400000, 1050000]
max_output_tokens = 128000
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

