[[models]]
# Source (checked 2026-08-07): https://platform.xiaomimimo.com/static/docs/quick-start/model.md
# MiMo removed length-based tiered billing: https://platform.xiaomimimo.com/docs/en-US/updates/feature
id = "mimo-v2.5-pro"
model_name = "mimo-v2.5-pro"
api = "openai"
provider = "mimo"
api_key_env = "MIMO_API_KEY"
base_url = "https://token-plan-cn.xiaomimimo.com"
thinking_format = "doubao"
# Source: https://platform.xiaomimimo.com/docs/en-US/api/chat/openai-api
# MiMo exposes thinking on/off rather than multiple effort values; High is its
# fixed enabled mode and Tomcat's shared Off control disables it.
supported_reasoning_levels = ["high"]
context_window = 1000000
context_window_options = [400000, 1000000]
max_output_tokens = 128000
capabilities = { vision = false, files = false, tools = true, reasoning = true, web_search = false }

[[models]]
# Source (checked 2026-08-07): https://docs.bigmodel.cn/cn/guide/models/text/glm-5.2
# The standard PaaS API identifies this 1M model as `glm-5.2`. The separate
# Coding Plan Anthropic relay documents a `[1m]` suffix; Tomcat uses PaaS, so
# context-tier selection must not alter this model name.
id = "glm-5.2"
model_name = "glm-5.2"
api = "openai"
provider = "zhipu"
api_key_env = "ZHIPU_API_KEY"
base_url = "https://open.bigmodel.cn/api/paas/v4"
thinking_format = "zai"
supported_reasoning_levels = ["low", "medium", "high", "xhigh", "max"]
context_window = 1000000
context_window_options = [400000, 1000000]
max_output_tokens = 128000
capabilities = { vision = false, files = false, tools = true, reasoning = true, web_search = false }

[[models]]
# Source (checked 2026-08-07): https://platform.moonshot.cn/docs/guide/start-using-kimi-api
# Moonshot documents this model's output ceiling as the remaining context after
# the prompt, not as a fixed model-wide cap. Omit max_output_tokens so Tomcat
# uses its configured conservative reserve instead of treating 256K as reserve.
id = "kimi-k2.7-code"
model_name = "kimi-k2.7-code"
api = "openai"
provider = "moonshot"
api_key_env = "MOONSHOT_API_KEY"
base_url = "https://api.moonshot.cn"
thinking_format = "doubao"
# Source: https://platform.moonshot.cn/docs/guide/start-using-kimi-api
# K2.7 Code supports thinking mode but does not document tunable effort tiers.
supported_reasoning_levels = ["high"]
context_window = 256000
capabilities = { vision = true, files = true, tools = true, reasoning = true, web_search = false }

