name: version-sync

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  check:
    name: check release version mirrors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test version tooling
        run: >-
          node --test
          scripts/release-version-core.test.mjs
          scripts/release-version-cli.test.mjs

      - name: Check checked-in version mirrors
        run: node scripts/release-version.mjs check
