name: release-ext

on:
  push:
    tags:
      - "ext-v*"
      - "dry-run-ext-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extension release tag to validate/package (for dry runs)"
        required: true
        type: string
      cli_run_id:
        description: "Optional release-cli workflow run ID that provides dry-run CLI artifacts"
        required: false
        type: string

permissions:
  contents: read

env:
  CLI_ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.cli_run_id || '' }}
  RAW_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: build extension packages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      extension_version: ${{ steps.guard.outputs.extension_version }}

    defaults:
      run:
        shell: bash
        working-directory: tomcat-vscode-ext

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          raw="${RAW_RELEASE_REF}"
          use_cli_artifacts=0
          case "${raw}" in
            dry-run-ext-v*)
              release_tag="$(printf '%s\n' "${raw}" | sed -E 's/^dry-run-(ext-v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
              use_cli_artifacts=1
              ;;
            ext-v*)
              release_tag="${raw}"
              ;;
            *)
              echo "Unsupported extension release ref: ${raw}" >&2
              exit 1
              ;;
          esac
          if [ -z "${release_tag}" ]; then
            echo "Could not resolve extension release tag from ${raw}" >&2
            exit 1
          fi
          if [ -n "${CLI_ARTIFACT_RUN_ID}" ]; then
            use_cli_artifacts=1
          fi
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"
          printf 'use_cli_artifacts=%s\n' "${use_cli_artifacts}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            tomcat-vscode-ext/package-lock.json
            tomcat-vscode-ext/gui/package-lock.json
          node-version: 22

      - name: Check version mirrors
        run: node ../scripts/release-version.mjs check

      - name: Validate extension release tag
        id: guard
        run: node ../.github/scripts/release/check-ext-tag.mjs "${GITHUB_WORKSPACE}" "${{ steps.meta.outputs.release_tag }}"

      - name: Install extension dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix gui ci

      - name: Build extension once
        run: npm run build

      - name: Resolve CLI dry-run workflow run
        if: steps.meta.outputs.use_cli_artifacts == '1' && env.CLI_ARTIFACT_RUN_ID == ''
        id: cli_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f event=push \
            -f head_sha="${GITHUB_SHA}" \
            -f per_page=50 \
            --jq '.workflow_runs | map(select(.name == "release-cli" and .conclusion == "success")) | first | .id')"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "Could not locate a successful release-cli dry-run for commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download dry-run CLI artifacts
        if: steps.meta.outputs.use_cli_artifacts == '1'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          merge-multiple: false
          path: bundles/artifacts
          pattern: release-cli-*
          repository: ${{ github.repository }}
          run-id: ${{ env.CLI_ARTIFACT_RUN_ID || steps.cli_run.outputs.run_id }}

      - name: Check dry-run CLI artifacts
        if: steps.meta.outputs.use_cli_artifacts == '1'
        env:
          PINNED_CLI_VERSION: ${{ steps.guard.outputs.bundled_cli_version }}
        run: |
          set -euo pipefail
          tag="cli-v${PINNED_CLI_VERSION}"
          asset_names=""
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            archive="tomcat-${tag}-${target}.tar.gz"
            artifact_dir="../bundles/artifacts/release-cli-${target}"
            test -f "${artifact_dir}/${archive}"
            asset_names="${asset_names}${archive}\n"
          done
          printf '%b' "${asset_names}" \
            | node ../.github/scripts/release/check-bundled-cli-assets.mjs "${PINNED_CLI_VERSION}"

      - name: Check pinned CLI release assets
        if: steps.meta.outputs.use_cli_artifacts != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_CLI_VERSION: ${{ steps.guard.outputs.bundled_cli_version }}
        run: |
          set -euo pipefail
          tag="cli-v${PINNED_CLI_VERSION}"
          asset_names="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          printf '%s\n' "${asset_names}" \
            | node ../.github/scripts/release/check-bundled-cli-assets.mjs "${PINNED_CLI_VERSION}"

      - name: Download pinned CLI checksums
        if: steps.meta.outputs.use_cli_artifacts != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_CLI_VERSION: ${{ steps.guard.outputs.bundled_cli_version }}
        run: |
          set -euo pipefail
          mkdir -p bundles/cli-checksums
          gh release download "cli-v${PINNED_CLI_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir bundles/cli-checksums
          test -s bundles/cli-checksums/SHA256SUMS

      - name: Package bundled and pure VSIX artifacts
        env:
          EXT_VERSION: ${{ steps.guard.outputs.extension_version }}
          GH_TOKEN: ${{ github.token }}
          PINNED_CLI_VERSION: ${{ steps.guard.outputs.bundled_cli_version }}
          USE_CLI_ARTIFACTS: ${{ steps.meta.outputs.use_cli_artifacts }}
        run: |
          set -euo pipefail
          mkdir -p dist bundles

          package_bundled_vsix() {
            local cli_target="$1"
            local vscode_target="$2"
            local tag="cli-v${PINNED_CLI_VERSION}"
            local bundle_dir="bundles/${cli_target}"
            local archive="tomcat-${tag}-${cli_target}.tar.gz"

            mkdir -p "${bundle_dir}"
            if [ "${USE_CLI_ARTIFACTS}" = "1" ]; then
              cp "../bundles/artifacts/release-cli-${cli_target}/${archive}" "${bundle_dir}/${archive}"
            else
              gh release download "${tag}" \
                --repo "${GITHUB_REPOSITORY}" \
                --pattern "${archive}" \
                --dir "${bundle_dir}"
            fi
            if [ "${USE_CLI_ARTIFACTS}" != "1" ]; then
              checksum="$(awk -v name="${archive}" '$2 == name { print }' bundles/cli-checksums/SHA256SUMS)"
              test -n "${checksum}"
              test "$(printf '%s\n' "${checksum}" | wc -l | tr -d ' ')" = "1"
              printf '%s\n' "${checksum}" | (cd "${bundle_dir}" && sha256sum -c -)
            fi
            tar -xzf "${bundle_dir}/${archive}" -C "${bundle_dir}"

            npx tsx scripts/package-vsix.ts \
              --skip-build \
              --target "${vscode_target}" \
              --bundle-binary "${bundle_dir}/tomcat" \
              --out "dist/tomcat-vscode-ext-${EXT_VERSION}-${vscode_target}.vsix"
          }

          package_bundled_vsix "aarch64-apple-darwin" "darwin-arm64"
          package_bundled_vsix "x86_64-apple-darwin" "darwin-x64"
          package_bundled_vsix "x86_64-unknown-linux-gnu" "linux-x64"

          npx tsx scripts/package-vsix.ts \
            --skip-build \
            --out "dist/tomcat-vscode-ext-${EXT_VERSION}.vsix"

      - name: Upload packaged VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ext-vsix
          path: tomcat-vscode-ext/dist/*.vsix
          if-no-files-found: error

      - name: Upload compiled installation test support
        uses: actions/upload-artifact@v4
        with:
          name: release-ext-test-support
          path: tomcat-vscode-ext/out
          if-no-files-found: error

  verify:
    name: native bundle acceptance (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
    defaults:
      run:
        shell: bash
        working-directory: tomcat-vscode-ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tomcat-vscode-ext/package-lock.json
      - run: npm ci
      - name: Download immutable release packages
        uses: actions/download-artifact@v4
        with:
          name: release-ext-vsix
          path: tomcat-vscode-ext/dist
      - name: Download compiled installation test support
        uses: actions/download-artifact@v4
        with:
          name: release-ext-test-support
          path: tomcat-vscode-ext/out
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2 libgtk-3-0 libnss3
      - name: Accept the exact native VSIX without rebuilding it
        env:
          EXT_VERSION: ${{ needs.build.outputs.extension_version }}
          TARGET: ${{ matrix.target }}
          TOMCAT_VSIX_VISUAL_ARTIFACTS_DIR: ${{ github.workspace }}/release-evidence/${{ matrix.target }}
        run: |
          set -euo pipefail
          vsix="dist/tomcat-vscode-ext-${EXT_VERSION}-${TARGET}.vsix"
          test -f "${vsix}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a -s '-screen 0 1440x1000x24' npm run verify:vsix -- --release-bundle "${vsix}"
          else
            npm run verify:vsix -- --release-bundle "${vsix}"
          fi
      - name: Retain native acceptance evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ext-evidence-${{ matrix.target }}
          path: release-evidence/${{ matrix.target }}
          if-no-files-found: warn

  publish:
    name: publish extension release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ext-v')
    needs: [build, verify]
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    permissions:
      contents: write

    steps:
      - name: Download packaged VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-ext-vsix
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.vsix > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.vsix
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Publish VSIX files to OpenVSX
        if: env.HAS_OVSX_PAT == 'true'
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          for file in dist/*.vsix; do
            npx ovsx publish "$file" -p "${OVSX_PAT}"
          done

  marketplace:
    name: publish accepted packages to Marketplace
    runs-on: ubuntu-latest
    # Explicit opt-in: GitHub releases must not depend on unfinished Marketplace setup.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ext-v') && vars.PUBLISH_MARKETPLACE == 'true'
    needs: [build, publish]
    environment: marketplace
    env:
      EXT_VERSION: ${{ needs.build.outputs.extension_version }}
      MARKETPLACE_TARGETS: darwin-arm64 darwin-x64 linux-x64
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CORE_OUTPUT: none
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the accepted release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download accepted VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-ext-vsix
          path: dist

      - name: Validate Marketplace publishing inputs
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Configure AZURE_CLIENT_ID in the marketplace environment}"
          : "${AZURE_TENANT_ID:?Configure AZURE_TENANT_ID in the marketplace environment}"
          : "${EXT_VERSION:?Missing accepted extension version}"
          : "${MARKETPLACE_TARGETS:?Missing Marketplace targets}"
          for target in ${MARKETPLACE_TARGETS}; do
            file="dist/tomcat-vscode-ext-${EXT_VERSION}-${target}.vsix"
            if [ ! -s "${file}" ]; then
              echo "Missing accepted Marketplace package: ${file}" >&2
              exit 1
            fi
          done

      - name: Setup publishing Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lockfile-pinned publishing tool without build scripts
        working-directory: tomcat-vscode-ext
        run: npm ci --ignore-scripts

      - name: Login to Marketplace publisher identity with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3, resolved 2026-10-13
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish accepted platform packages to Marketplace
        working-directory: tomcat-vscode-ext
        run: |
          set -euo pipefail
          # vsce gives an inherited PAT precedence over --azure-credential.
          unset VSCE_PAT
          for target in ${MARKETPLACE_TARGETS}; do
            file="../dist/tomcat-vscode-ext-${EXT_VERSION}-${target}.vsix"
            npx --no-install vsce publish --azure-credential --packagePath "${file}"
          done
