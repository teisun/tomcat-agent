# Temporary acceptance-branch workflow; do not merge this narrowing into develop.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Windows ACP cancellation acceptance
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: tomcat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Setup Node for test fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tomcat -> target
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Check test formatting and types
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/format.log"
          cargo clippy --test acp_stdio_e2e -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Build current CLI
        run: |
          set -o pipefail
          cargo build --bin tomcat 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Run only the pending Windows case
        run: |
          set -o pipefail
          bash scripts/run-integration-tests.sh integration-serial -E 'binary(acp_stdio_e2e) and test(=cancel_stops_background_work_before_a_backpressured_host_resumes_reading)' 2>&1 | tee "$RUNNER_TEMP/acp-cancel.log"
      - name: Upload Windows acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acp-cancel-${{ github.sha }}
          path: |
            ${{ runner.temp }}/format.log
            ${{ runner.temp }}/clippy.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/acp-cancel.log
          if-no-files-found: error
