name: ci

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "tomcat/**"
      - "tomcat-vscode-ext/**"
      - "scripts/dev-install.*"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tomcat/**"
      - "tomcat-vscode-ext/**"
      - "scripts/dev-install.*"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      cli-discovery:
        description: "Also run unified CLI + fixed Multica discovery on all four native targets (no release)"
        type: boolean
        default: false
      allow-runner-path:
        description: "Allow PATH verification in the disposable Windows hosted account; restore exact original values"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust gate-fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    defaults:
      run:
        # Windows runs Git Bash: the gate script and the bash tool under test both need it.
        shell: bash
        working-directory: tomcat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for test fixtures
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tomcat -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # search_files tests cover the ripgrep backend; without rg the tool uses a walker without context lines.
      - name: Install ripgrep
        run: |
          case "$RUNNER_OS" in
            Windows) choco install ripgrep --no-progress -y ;;
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew install ripgrep ;;
          esac
          rg --version

      - name: Test Unix development-install wrapper without installing
        if: runner.os != 'Windows'
        working-directory: .
        run: node --test scripts/dev-install.test.mjs

      - name: Run gate-fast
        run: |
          set -o pipefail
          bash scripts/run-integration-tests.sh gate-fast 2>&1 | tee "$RUNNER_TEMP/gate-fast.log"

      # Raw job logs need repository admin rights; annotations are visible to every reader.
      - name: Annotate failures
        if: failure()
        run: |
          failures=$(sed 's/\x1b\[[0-9;]*m//g; s/\r$//' "$RUNNER_TEMP/gate-fast.log" \
            | awk '/panicked at/ { print; for (i = 0; i < 4 && (getline line) > 0; i++) print line; next }
                   /^=== \[|^ *(FAIL|TIMEOUT|SIGSEGV|SIGABRT) \[|^ *Summary \[|^error(\[E[0-9]+\])?: | FAILED$|^ *(left|right): /' \
            | awk '!seen[$0]++' | cut -c1-600 | head -n 400)
          # GitHub truncates each annotation to about 4 KB: emit consecutive parts instead.
          part=0
          while [ -n "$failures" ] && [ "$part" -lt 9 ]; do
            chunk=$(printf '%s\n' "$failures" | awk '{ n += length($0) + 1; if (n > 3500 && NR > 1) exit; print }')
            failures=$(printf '%s\n' "$failures" | tail -n +"$(( $(printf '%s\n' "$chunk" | wc -l) + 1 ))")
            part=$((part + 1))
            chunk=${chunk//'%'/%25}
            echo "::error title=gate-fast failures (${{ matrix.os }}) part ${part}::${chunk//$'\n'/%0A}"
          done

      - name: Upload Rust gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gate-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/gate-fast.log
          if-no-files-found: warn

  extension:
    name: extension gate:fast (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: tomcat-vscode-ext

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: |
            tomcat-vscode-ext/package-lock.json
            tomcat-vscode-ext/gui/package-lock.json
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix gui ci

      - name: Run gate:fast
        run: npm run gate:fast

      - name: Test Windows development-install wrapper without installing
        working-directory: .
        run: node --test scripts/dev-install.test.mjs

      - name: Test proxy, build selection, and isolated acceptance contracts
        run: npx vitest run --maxWorkers 4 tests/windows_system_proxy.test.ts tests/build_tomcat_binary.test.ts tests/serve_fixture_lifecycle.test.ts tests/vscode_launch_env.test.ts tests/playwright_mcp_smoke.test.ts

  cli-discovery:
    name: unified-cli native (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && inputs['cli-discovery']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, binary: tomcat }
          - { os: macos-15-intel, target: darwin-x64, binary: tomcat }
          - { os: ubuntu-22.04, target: linux-x64, binary: tomcat }
          - { os: windows-latest, target: win32-x64, binary: tomcat.exe }
    defaults:
      run:
        shell: bash
        working-directory: tomcat-vscode-ext
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit disposable Windows PATH authorization
        if: runner.os == 'Windows'
        env:
          ALLOW_RUNNER_PATH: ${{ inputs['allow-runner-path'] }}
        run: test "$ALLOW_RUNNER_PATH" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Checkout immutable Multica source (read-only build input)
        uses: actions/checkout@v4
        with:
          repository: teisun/multica
          ref: 8ea00434a47f60b92aaf1504ecb29a2b70f82d0c
          path: .agents/multica-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .agents/multica-source/server/go.mod
          cache-dependency-path: .agents/multica-source/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tomcat-vscode-ext/package-lock.json
            tomcat-vscode-ext/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tomcat -> target
          key: cli-discovery-${{ matrix.target }}
      - name: Install dependencies and prepare evidence directory
        run: |
          npm ci
          npm --prefix gui ci
          mkdir -p "../.agents/acceptance/cli-discovery/${{ matrix.target }}"
      - name: Installer, interruption, CLI and guard checks on the native host
        working-directory: tomcat
        run: |
          set -euo pipefail
          {
            cargo test --locked --lib user_install
            cargo test --locked --test cli_tests self_install
            cargo test --locked --test nested_cli_guard_tests nested_models_is_allowed_but_service_lifecycle_and_installation_remain_blocked
          } 2>&1 | tee "../.agents/acceptance/cli-discovery/${{ matrix.target }}/installer-tests.log"
      - name: Build fixed Multica and Tomcat-owned path observer in a disposable source copy
        run: node --import tsx scripts/multicaCliDiscovery.ts ../.agents/multica-source "../.agents/acceptance/cli-discovery/${{ matrix.target }}"
      - name: Build real native CLI and extension
        run: |
          cargo build --locked --release --manifest-path ../tomcat/Cargo.toml --bin tomcat
          npm run build
      - name: Package unpublished native VSIX
        run: >-
          npm run package:vsix -- --skip-build --target ${{ matrix.target }}
          --bundle-binary ../tomcat/target/release/${{ matrix.binary }}
          --out ../.agents/acceptance/cli-discovery/${{ matrix.target }}/tomcat.vsix
      - name: Verify real VSIX, disconnected logs and scriptless Multica discovery
        env:
          TOMCAT_CLI_DISCOVERY_ACCEPTANCE: "1"
          TOMCAT_MULTICA_ACCEPT_REVISION: 8ea00434a47f60b92aaf1504ecb29a2b70f82d0c
          ACCEPT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export TOMCAT_MULTICA_ACCEPT_BINARY="$(node -p 'require("node:path").resolve("../.agents/acceptance/cli-discovery", process.env.ACCEPT_TARGET, process.platform === "win32" ? "multica.exe" : "multica")')"
          export TOMCAT_MULTICA_CONFIG_PROBE="$(node -p 'require("node:path").resolve("../.agents/acceptance/cli-discovery", process.env.ACCEPT_TARGET, process.platform === "win32" ? "multica-config-probe.exe" : "multica-config-probe")')"
          export TOMCAT_VSIX_VISUAL_ARTIFACTS_DIR="$(node -p 'require("node:path").resolve("../.agents/shots/cli-discovery", process.env.ACCEPT_TARGET)')"
          args=(run verify:vsix -- --release-bundle "../.agents/acceptance/cli-discovery/$ACCEPT_TARGET/tomcat.vsix")
          if [ "$RUNNER_OS" = Windows ]; then args+=(--allow-runner-path); fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm "${args[@]}"
          else
            npm "${args[@]}"
          fi 2>&1 | tee "../.agents/acceptance/cli-discovery/$ACCEPT_TARGET/native-vsix.log"
      - name: Preserve native receipts and PNG, ARIA, console, cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-discovery-${{ matrix.target }}-${{ github.sha }}
          path: |
            .agents/acceptance/cli-discovery/**/*.json
            .agents/acceptance/cli-discovery/**/*.log
            .agents/shots/cli-discovery/**
          if-no-files-found: error
          include-hidden-files: true

  shared-service-windows:
    name: shared service OS proxy and real VS Code (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      TOMCAT_VSIX_VISUAL_ARTIFACTS_DIR: ${{ github.workspace }}/.agents/shots/windows-system-proxy
    defaults:
      run:
        working-directory: tomcat-vscode-ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tomcat-vscode-ext/package-lock.json
            tomcat-vscode-ext/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tomcat -> target
      - name: Install cargo-nextest for the acceptance process boundary
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install test dependencies
        run: |
          npm ci
          npm --prefix gui ci
      # A serial, opt-in wrapper snapshots/restores the actual user proxy registry.
      # The ignored Rust controls must each execute one test, followed by a real
      # VS Code task, GUI process exit, and non-starting probe of the same service.
      - name: Verify system proxy and window lifecycle
        shell: bash
        run: node --import tsx scripts/run-windows-system-proxy.ts
      - name: Upload proxy requests, GUI and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shared-service-${{ github.sha }}
          path: .agents/shots/windows-system-proxy
          if-no-files-found: error
          include-hidden-files: true
